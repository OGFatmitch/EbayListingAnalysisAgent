[project]
name = "ebay-guard-agent"
version = "0.1.0"
description = "LangGraph agent to evaluate eBay listing legitimacy, seller trust, and pricing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.50",
  "langchain-openai>=0.2.9",
  "pydantic>=2.9.2",
  "requests>=2.32.3",
  "beautifulsoup4>=4.12.3",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
  "rich>=13.9.2",
  "streamlit>=1.40.0",
  "playwright>=1.49.0"
]

[project.scripts]
ebay-guard = "ebay_guard.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
